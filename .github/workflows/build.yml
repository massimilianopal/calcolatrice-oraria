name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test docs/ore.test.mjs

  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./ore
      - run: ./build.sh
      - run: zip CalcolatriceOre.zip CalcolatriceOre.exe
      - uses: actions/upload-artifact@v4
        with:
          name: CalcolatriceOre
          path: CalcolatriceOre.exe
      - name: Pubblica la release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: CalcolatriceOre.zip
